server {
    listen 80;
    server_name _;
    proxy_read_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(docs(?:/.*)?|swagger|openapi\.json|health)$ {
        proxy_pass http://river:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://river:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    # No URI suffix: preserve the complete path and encoded image query value.
    location ^~ /streamer/ {
        proxy_pass http://river:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location = /wmts {
        proxy_pass http://river:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /ws {
        proxy_pass http://river:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

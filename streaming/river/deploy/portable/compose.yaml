services:
  river:
    image: river/backend:2026.10.12
    restart: unless-stopped
    environment:
      RIVER_S3_LL_INITIAL_BYTES:
      RIVER_S3_TLM_LL_FUSED_BYTES:
      RIVER_S3_PROGRESSIVE_EARLY_DISCOVERY:
      RIVER_GROK_PROGRESSIVE_PREFIX:
      RIVER_PREFIX_RECOVERY_PROBE:
      RIVER_S3_INDEX_PILOT_BYTES:
      RIVER_MEMORY_BUDGET_BYTES:
      RIVER_CACHE_MEMORY_BYTES:
      RIVER_RESOURCE_ADAPTIVE:
      RIVER_ASSET_METADATA_CACHE_BYTES:
      RIVER_ASSET_LOCATOR_CACHE_BYTES:
      RIVER_ASSET_LOCATOR_CACHE_ENTRIES:
      RIVER_S3_METADATA_TTL_MS:
      RIVER_S3_INDEX_MEMORY_BYTES:
      RIVER_S3_INDEX_MEMORY_ENTRIES:
      RIVER_S3_INDEX_CACHE_BYTES:
      RIVER_S3_INDEX_CACHE_ENTRIES:
      RIVER_S3_HEADER_CACHE_BYTES:
      RIVER_NATIVE_TILE_CACHE_BYTES:
      RIVER_RASTER_CACHE_BYTES:
      RIVER_CORS_ORIGINS: ${RIVER_CORS_ORIGINS:-*}
      RIVER_S3_ADAPTIVE_READS: ${RIVER_S3_ADAPTIVE_READS:-observe}
      RIVER_ASSET_CATALOG: ${RIVER_ASSET_CATALOG:-/data/river-assets.json}
      RIVER_ENABLE_NVIDIA: ${RIVER_ENABLE_NVIDIA:-auto}
      RIVER_LOCAL_SOURCE_CACHE_BYTES: ${RIVER_LOCAL_SOURCE_CACHE_BYTES:-2147483648}
      RIVER_HT_CACHE_BYTES: ${RIVER_HT_CACHE_BYTES:-0}
      RIVER_GROK_THREADS_PER_DECODE: ${RIVER_GROK_THREADS_PER_DECODE:-2}
      RIVER_S3_RANGE_CONCURRENCY: "${RIVER_S3_RANGE_CONCURRENCY:-}"
      RIVER_S3_RANGE_OVERFETCH_RATIO: ${RIVER_S3_RANGE_OVERFETCH_RATIO:-2}
      RIVER_HT_CACHE_WORKERS: ${RIVER_HT_CACHE_WORKERS:-2}
      RIVER_NVJPEG2000_NATIVE_WORKERS: "${RIVER_NVJPEG2000_NATIVE_WORKERS:-}"
      RIVER_NVJPEG2000_WORKERS: ${RIVER_NVJPEG2000_WORKERS:-auto}
      RIVER_DECODE_CONCURRENCY: ${RIVER_DECODE_CONCURRENCY:-auto}
      RIVER_OTEL_ENABLED: ${RIVER_OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4317}
    ports:
      - "${RIVER_BIND_ADDRESS:-127.0.0.1}:${RIVER_API_PORT:-18080}:8080"
    volumes:
      - ${RIVER_DATA_DIR:-./data}:/data:ro
      - river-cache:/var/lib/river/s3-cache
  viewer:
    image: river/ui:2026.10.12
    restart: unless-stopped
    ports:
      - "${RIVER_BIND_ADDRESS:-127.0.0.1}:${RIVER_UI_PORT:-18765}:80"
    depends_on:
      river:
        condition: service_healthy
volumes:
  river-cache:

[package]
name = "river-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
grok = ["dep:libloading"]
jxl = ["dep:jxl-sys"]
nvjpeg2000 = ["dep:reqwest", "dep:lz4_flex", "dep:libloading"]

[dependencies]
async-trait = "0.1.89"
anyhow.workspace = true
axum.workspace = true
bytes = "1"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tower = { version = "0.5", features = ["util"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64.workspace = true
futures-util.workspace = true
hex.workspace = true
image.workspace = true
jpeg2k.workspace = true
jxl-sys = { workspace = true, optional = true }
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
object_store.workspace = true
openjpeg-sys = "1.0.12"
png.workspace = true
reqwest = { workspace = true, optional = true }
lz4_flex = { version = "0.11", optional = true }
libloading = { version = "0.8", optional = true }
river-core = { path = "../river-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
libc = "0.2"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webp.workspace = true
redis = { version = "0.32.7", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }

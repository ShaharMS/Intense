      RIVER_CONFIG_MODE: env
      RIVER_RESOURCE_DISPLAY: 'off'
      RIVER_LOG_LEVEL: warn
      RIVER_AUTO_ADAPTATION_MODE: no-disk
    ports:
    - 127.0.0.1:${RIVER_LTS_PORT:-18082}:8080
    volumes:
    - ./corpus:/opt/river/corpus:ro,z
    - ./deploy/local-state/lts/config:/var/lib/river/config:z
    labels:
      river.backend-slot: lts
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',
        timeout=4)
      interval: 10s

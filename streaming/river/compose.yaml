      RIVER_CORS_ORIGINS: ${RIVER_REPLICA_3_CORS_ORIGINS:-http://127.0.0.1:18765,http://127.0.0.1:19074,http://localhost:19074}
      RIVER_OTEL_ENABLED: ${RIVER_REPLICA_3_OTEL_ENABLED:-false}
    ports:

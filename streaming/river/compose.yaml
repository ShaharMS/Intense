# Generated by tools/river-compose.py; six fixed backend slots.
name: river
services:
  corpus:
    image: curlimages/curl:8.12.1
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "if [ ! -s /corpus/Bretagne2.j2k ]; then\n  curl --fail --location --retry 3\
      \ --output /corpus/Bretagne2.j2k https://raw.githubusercontent.com/uclouvain/openjpeg-data/master/input/nonregression/Bretagne2.j2k\n\
      fi\necho '94a94669d839b13292340cbbdec6b96c81475eb1e1f6158c55245a7355437290 \
      \ /corpus/Bretagne2.j2k' | sha256sum -c -s\n"
    volumes:
    - river-corpus:/corpus
    profiles:
    - storage-tools
  viewer:
    image: nginx:1.27-alpine
    ports:
    - 127.0.0.1:18765:80
    volumes:
    - ./web:/usr/share/nginx/html:ro
    - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      replica-1:
        condition: service_started
    environment:
      RIVER_VIEWER_BACKEND: ${RIVER_VIEWER_BACKEND:-replica-1:8080}
      NGINX_ENVSUBST_FILTER: ^RIVER_VIEWER_BACKEND$
  atlas-mosaic:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    profiles:
    - legacy-tools
    entrypoint:
    - /bin/bash
    - /tools/build-sentinel-date-mosaics.sh
    environment:
      MAX_DATES: ${MAX_DATES:-35}
    volumes:
    - ./corpus/cache/sentinel-atlas:/input:ro
    - ./corpus/cache/sentinel-date-mosaics:/output
    - ./tools:/tools:ro
  gain-pyramid:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    profiles:
    - legacy-tools
    entrypoint:
    - /bin/bash
    - /tools/build-river-gain-pyramid.sh
    volumes:
    - ./corpus/cache/sentinel-date-mosaics:/output
    - ./tools:/tools:ro
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: river
      MINIO_ROOT_PASSWORD: river-local-only-change-me
    ports:
    - 127.0.0.1:18000:9000
    - 127.0.0.1:18001:9001
    volumes:
    - river-minio:/data
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
    - 127.0.0.1:18686:16686
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    volumes:
    - ./deploy/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    ports:
    - 127.0.0.1:18090:9090
    volumes:
    - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  loki:
    image: grafana/loki:3.4.2
    command:
    - -config.file=/etc/loki/config.yml
    ports:
    - 127.0.0.1:18310:3100
    volumes:
    - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: river
      GF_SECURITY_ADMIN_PASSWORD: river-local-only-change-me
    ports:
    - 127.0.0.1:18300:3000
    volumes:
    - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
  stable:
    image: ${RIVER_STABLE_IMAGE:-river:stable}
    pull_policy: never
    container_name: river-stable
    cpus: ${RIVER_STABLE_CPUS:-4}
    mem_limit: ${RIVER_STABLE_MEMORY:-2g}
    environment:
      RIVER_PROFILE: auto
      RIVER_ENABLE_NVIDIA: ${RIVER_ENABLE_NVIDIA:-false}
      RIVER_S3_CONNECTIONS_FILE: /var/lib/river/config/s3-connections.json
      RIVER_S3_CACHE_ROOT: /var/lib/river/s3-cache
      RIVER_CORPUS_ROOT: /opt/river/corpus
      RIVER_MOSAIC_ROOT: /app/sentinel-date-mosaics
      RIVER_ASSET_CATALOG: /app/sentinel-date-mosaics/river-assets.json
      RIVER_S3_ADAPTIVE_READS: ${RIVER_S3_ADAPTIVE_READS:-observe}
      RIVER_S3_SOURCE_MAX_REQUESTS: ${RIVER_S3_SOURCE_MAX_REQUESTS:-8}
      RIVER_S3_MAX_RETRIES: ${RIVER_S3_MAX_RETRIES:-2}
      RIVER_TRACE_SOURCE_READS: '0'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: river-server
      RIVER_CORS_ORIGINS: ${RIVER_STABLE_CORS_ORIGINS:-http://127.0.0.1:18765,http://127.0.0.1:19074,http://localhost:19074}
      RIVER_OTEL_ENABLED: ${RIVER_STABLE_OTEL_ENABLED:-false}
    ports:
    - 127.0.0.1:${RIVER_STABLE_PORT:-18081}:8080
    volumes:
    - river-corpus:/opt/river/corpus:ro
    - river-corpus:/app/corpus:ro
    - ./corpus/cache/sentinel-date-mosaics:/app/sentinel-date-mosaics:ro
    - ./deploy/local-state/stable/config:/var/lib/river/config
    - stable-cache:/var/lib/river/s3-cache
    labels:
      river.backend-slot: stable
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
  lts:
    image: ${RIVER_LTS_IMAGE:-river:lts}
    pull_policy: never
    container_name: river-lts
    cpus: ${RIVER_LTS_CPUS:-4}
    mem_limit: ${RIVER_LTS_MEMORY:-2g}
    environment:

# Generated by tools/river-compose.py; six fixed backend slots.
name: river
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: river
      MINIO_ROOT_PASSWORD: river-local-only-change-me
    ports:
    - 127.0.0.1:18000:9000
    - 127.0.0.1:18001:9001
    volumes:
    - river-minio:/data
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
    - 127.0.0.1:18686:16686
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    volumes:
    - ./deploy/otel/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    ports:
    - 127.0.0.1:18090:9090
    volumes:
    - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  loki:
    image: grafana/loki:3.4.2
    command:
    - -config.file=/etc/loki/config.yml
    ports:
    - 127.0.0.1:18310:3100
    volumes:
    - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: river
      GF_SECURITY_ADMIN_PASSWORD: river-local-only-change-me
    ports:
    - 127.0.0.1:18300:3000
    volumes:
    - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
  stable:
    image: ${RIVER_STABLE_IMAGE:-localhost/river:m1233}
    pull_policy: never
    container_name: river-stable
    cpus: 4
    mem_limit: 2g
    environment:
      RIVER_PROFILE: auto
      RIVER_ENABLE_NVIDIA: ${RIVER_ENABLE_NVIDIA:-false}
      RIVER_S3_CONNECTIONS_FILE: /var/lib/river/config/s3-connections.json
      RIVER_S3_CACHE_ROOT: /var/lib/river/s3-cache
      RIVER_CORPUS_ROOT: /opt/river/corpus
      RIVER_S3_ADAPTIVE_READS: ${RIVER_S3_ADAPTIVE_READS:-observe}
      RIVER_S3_SOURCE_MAX_REQUESTS: ${RIVER_S3_SOURCE_MAX_REQUESTS:-16}
      RIVER_S3_MAX_RETRIES: ${RIVER_S3_MAX_RETRIES:-2}
      RIVER_TRACE_SOURCE_READS: '0'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: river-server
      RIVER_CORS_ORIGINS: ${RIVER_STABLE_CORS_ORIGINS:-${RIVER_CORS_ORIGINS:-*}}
      RIVER_OTEL_ENABLED: 'false'
      RIVER_ADMIN_TOKEN: fixture-admin
      RIVER_CONFIG_MODE: env
      RIVER_RESOURCE_DISPLAY: 'off'
      RIVER_LOG_LEVEL: warn
      RIVER_AUTO_ADAPTATION_MODE: no-disk
    ports:
    - 127.0.0.1:${RIVER_STABLE_PORT:-18081}:8080
    volumes:
    - ./corpus:/opt/river/corpus:ro,z
    - ./deploy/local-state/stable/config:/var/lib/river/config:z
    labels:
      river.backend-slot: stable
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',
        timeout=4)
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
    shm_size: 512m
  lts:
    image: ${RIVER_LTS_IMAGE:-localhost/river:m1233}
    pull_policy: never
    container_name: river-lts
    cpus: 4
    mem_limit: 2g
    environment:
      RIVER_PROFILE: auto
      RIVER_ENABLE_NVIDIA: ${RIVER_ENABLE_NVIDIA:-false}
      RIVER_S3_CONNECTIONS_FILE: /var/lib/river/config/s3-connections.json
      RIVER_S3_CACHE_ROOT: /var/lib/river/s3-cache
      RIVER_CORPUS_ROOT: /opt/river/corpus
      RIVER_S3_ADAPTIVE_READS: ${RIVER_S3_ADAPTIVE_READS:-observe}
      RIVER_S3_SOURCE_MAX_REQUESTS: ${RIVER_S3_SOURCE_MAX_REQUESTS:-16}
